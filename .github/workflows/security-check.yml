name: Security Check

on:
  push:
    branches: [main]
    paths:
      - 'programs/**/*.rs'
  workflow_dispatch:

jobs:
  security-audit:
    name: Claude Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Security Check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/security_check.py programs/nautilus/src/lib.rs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-check-results
          path: ${{ github.step_summary }}
          if-no-files-found: ignore